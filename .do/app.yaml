## DigitalOcean App Platform — ETaxFlow
## Deploy via: doctl apps create --spec .do/app.yaml
## Or: push to GitHub and import via https://cloud.digitalocean.com/apps

name: etaxflow
region: nyc  # nyc3 — matches your managed DB location

services:
  # ── API + Frontend (FastAPI serves both) ─────────────────────────────
  - name: api
    source_dir: /
    dockerfile_path: backend/Dockerfile
    github:
      branch: main
      deploy_on_push: true
      repo: shefeeqcsulaiman-dot/host
    http_port: 8000
    health_check:
      http_path: /health
      timeout_seconds: 10
      failure_threshold: 3
      success_threshold: 1
    instance_count: 3
    instance_size_slug: professional-s   # 2 vCPU · 2 GB — handles ~500 concurrent users
    autoscaling:
      # CPU-based autoscaling reacts over minutes, not seconds — useless
      # against a short concurrent-request burst. Raised the static floor
      # from 2 to 3 instances specifically to absorb bursts (e.g. ~200
      # concurrent users) that resolve faster than autoscaling can respond.
      # instance_count above must match this floor.
      min_instance_count: 3
      max_instance_count: 6
      metrics:
        - type: CPU_UTILIZATION
          percent: 70
    envs:
      # ── Database (your DigitalOcean Managed PostgreSQL) ───────────────
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Set in DO dashboard:
        # postgresql+psycopg2://doadmin:<PASSWORD>@db-pgsql-nyc3-67475-do-user-38425833-0.e.db.ondigitalocean.com:25060/defaultdb?sslmode=require
        value: REPLACE_IN_DO_DASHBOARD

      # ── Redis ─────────────────────────────────────────────────────────
      - key: REDIS_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Set in DO dashboard after creating Managed Redis cluster
        value: REPLACE_IN_DO_DASHBOARD

      # ── App settings ──────────────────────────────────────────────────
      - key: APP_ENV
        scope: RUN_AND_BUILD_TIME
        value: production

      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        # Generate: python -c "import secrets; print(secrets.token_hex(32))"
        value: REPLACE_IN_DO_DASHBOARD

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        scope: RUN_TIME
        value: "1440"

      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: https://app.etaxflow.com,http://localhost:5173,http://127.0.0.1:5173

      - key: API_BASE_URL
        scope: RUN_TIME
        value: https://app.etaxflow.com/api/v1

      # ── Workers & pool ────────────────────────────────────────────────
      # Cluster-wide DB connection budget: this pool (10+15=25/instance) x
      # instance_count (3) = 75 from the web tier, plus the worker's own
      # small reserved slice below (20) = 95 total. Verify this against the
      # managed Postgres plan's actual max_connections (DO dashboard ->
      # Databases -> cluster -> Settings) before raising further — a pool
      # budget that exceeds the DB's own ceiling is what caused the
      # intermittent 500s this was tuned to fix, not too-small a pool.
      # 3 workers per 2 GB / 2 vCPU instance: each worker is a full copy of the app
      # (~150-250 MB) with its own DB pool, so 6 left little memory for heavy requests.
      - key: WORKERS
        scope: RUN_TIME
        value: "3"

      # Recycle each worker after this many requests (uvicorn --limit-max-requests).
      - key: MAX_REQUESTS
        scope: RUN_TIME
        value: "2000"

      - key: DB_POOL_SIZE
        scope: RUN_TIME
        value: "10"

      - key: DB_MAX_OVERFLOW
        scope: RUN_TIME
        value: "15"

      - key: DB_POOL_TIMEOUT
        scope: RUN_TIME
        value: "30"

      - key: BOOTSTRAP_RECORD_CAP
        scope: RUN_TIME
        value: "5000"

      # ── Celery ───────────────────────────────────────────────────────
      - key: CELERY_TASK_ALWAYS_EAGER
        scope: RUN_TIME
        value: "false"

      # ── Seed passwords — set strong values before first deploy ────────
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      - key: SUPERADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      # ── S3-compatible storage (Spaces or AWS S3) ──────────────────────
      - key: S3_ENDPOINT_URL
        scope: RUN_TIME
        # DigitalOcean Spaces: https://nyc3.digitaloceanspaces.com
        value: ""

      - key: S3_BUCKET
        scope: RUN_TIME
        value: etaxflow-documents

      - key: S3_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      - key: S3_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      - key: AWS_REGION
        scope: RUN_TIME
        value: nyc3

      # ── AI extraction (Anthropic Claude, OpenAI fallback) ──────────────
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

  # ── Celery background worker ──────────────────────────────────────────
  # -B embeds the beat scheduler in this same process (drives periodic tasks
  # like hr.auto_checkout_stale_sessions). Safe only because instance_count
  # is 1 below — if this is ever scaled beyond 1 instance, beat must be
  # split into its own single-instance service first, or every instance
  # will fire the same periodic task duplicately.
  - name: worker
    source_dir: /
    dockerfile_path: backend/Dockerfile
    run_command: celery -A app.worker worker -B --loglevel=info --concurrency=4
    github:
      branch: main
      deploy_on_push: true
      repo: shefeeqcsulaiman-dot/host
    instance_count: 1
    instance_size_slug: basic-s          # 1 vCPU · 2 GB
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      - key: REDIS_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      - key: APP_ENV
        scope: RUN_AND_BUILD_TIME
        value: production

      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      - key: CELERY_TASK_ALWAYS_EAGER
        scope: RUN_TIME
        value: "false"

      # Previously unset here, so this service silently inherited the
      # code's higher default (db_pool_size=20, db_max_overflow=40 in
      # config.py) x 4 prefork processes (--concurrency=4 above) = a
      # theoretical 240-connection ceiling for a background queue, dwarfing
      # the web tier's own budget for the traffic that actually matters.
      # 3+2=5/process x 4 = 20 max is a deliberately small, explicit
      # reserved slice instead.
      - key: DB_POOL_SIZE
        scope: RUN_TIME
        value: "3"

      - key: DB_MAX_OVERFLOW
        scope: RUN_TIME
        value: "2"

      - key: DB_POOL_TIMEOUT
        scope: RUN_TIME
        value: "30"

      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      # backup.nightly_all_companies runs in this worker's beat scheduler
      # and needs these to reach Spaces -- without them it silently falls
      # back to the container's local disk, wiped on every redeploy.
      - key: S3_ENDPOINT_URL
        scope: RUN_TIME
        value: ""

      - key: S3_BUCKET
        scope: RUN_TIME
        value: etaxflow-documents

      - key: S3_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      - key: S3_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD

      - key: AWS_REGION
        scope: RUN_TIME
        value: nyc3
