## Render Blueprint — TaxFlow UAE
## Deploy: connect this repo in Render dashboard → "New Blueprint"
## After first deploy, set API_BASE_URL on the frontend service to match
## the actual backend service URL shown in Render dashboard.

services:

  # ── BACKEND (FastAPI) ────────────────────────────────────────────
  - type: web
    name: etaxflow-api
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etaxflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://etaxflow.onrender.com,http://localhost:5173
      - key: REDIS_URL
        value: memory://
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: S3_ENDPOINT_URL
        value: ""
      - key: S3_ACCESS_KEY_ID
        value: ""
      - key: S3_SECRET_ACCESS_KEY
        value: ""

  # ── FRONTEND (Static Site) ───────────────────────────────────────
  - type: web
    name: etaxflow
    runtime: static
    buildCommand: bash build-frontend.sh
    staticPublishPath: frontend/public
    envVars:
      # Must match the backend service URL above (etaxflow-api)
      - key: API_BASE_URL
        value: https://etaxflow-api.onrender.com/api/v1
    headers:
      - path: /taxflow/config.js
        name: Cache-Control
        value: no-cache, no-store
    routes:
      - type: redirect
        source: /
        destination: /landing.html

# ── POSTGRESQL DATABASE ──────────────────────────────────────────
databases:
  - name: etaxflow-db
    databaseName: etaxflow
    user: etaxflow
    plan: free
