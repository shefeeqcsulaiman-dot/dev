## Render Blueprint — ETaxFlow
## Web service (FastAPI + frontend) + managed PostgreSQL

databases:
  - name: etaxflow-db
    databaseName: etaxflow
    plan: free

services:
  - type: web
    name: etaxflow
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etaxflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://etaxflow.onrender.com
      - key: REDIS_URL
        value: memory://
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: API_BASE_URL
        value: https://etaxflow.onrender.com/api/v1
      - key: OPENAI_API_KEY
        sync: false
