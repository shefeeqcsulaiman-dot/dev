## Render Blueprint — ETaxFlow
## Web service (FastAPI + frontend) + PostgreSQL + Redis + Celery worker

databases:
  - name: etaxflow-db
    databaseName: etaxflow
    plan: free

services:
  - type: redis
    name: etaxflow-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: etaxflow
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etaxflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: etaxflow-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://etaxflow.onrender.com
      - key: API_BASE_URL
        value: https://etaxflow.onrender.com/api/v1
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: WORKERS
        value: "2"
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: etaxflow-celery
    runtime: docker
    startCommand: celery -A app.worker worker --loglevel=info --concurrency=2
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etaxflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: etaxflow-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: etaxflow
          type: web
          envVarKey: SECRET_KEY
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
