## Render Blueprint — TaxFlow UAE
## One service: FastAPI backend + frontend static files served together

services:
  - type: web
    name: etaxflow
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://etaxflow.onrender.com
      - key: REDIS_URL
        value: memory://
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: API_BASE_URL
        value: https://etaxflow.onrender.com/api/v1
