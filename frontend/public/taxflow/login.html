<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign In — ETaxFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'DM Sans',system-ui,sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(145deg,#040d1e 0%,#0a1f4a 45%,#07163a 100%);
    }
    .card{
      background:#fff;
      border-radius:20px;
      padding:44px 40px 36px;
      width:100%;
      max-width:420px;
      margin:20px;
      box-shadow:0 40px 120px rgba(0,0,0,.45);
    }
    .brand{text-align:center;margin-bottom:34px;}
    .brand-img{width:140px;height:auto;margin-bottom:10px;}
    .brand-sub{font-size:13.5px;color:#6b7a99;margin-top:2px;}
    .error{
      display:none;
      background:#fef2f2;border:1px solid #fecaca;border-radius:9px;
      padding:11px 14px;font-size:13px;color:#dc2626;margin-bottom:20px;
    }
    .field{margin-bottom:16px;}
    .field label{
      display:block;font-size:11px;font-weight:600;letter-spacing:.6px;
      text-transform:uppercase;color:#374151;margin-bottom:7px;
    }
    .field input{
      width:100%;padding:11px 15px;
      border:1.5px solid #d1d5db;border-radius:9px;
      font-size:14px;font-family:inherit;color:#111827;
      background:#f9fafb;outline:none;
      transition:border-color .15s,box-shadow .15s,background .15s;
    }
    .field input:focus{
      border-color:#4f8ef0;
      box-shadow:0 0 0 3px rgba(79,142,240,.15);
      background:#fff;
    }
    .field.last{margin-bottom:24px;}
    .btn{
      width:100%;padding:13px;
      background:linear-gradient(135deg,#073D7F,#4f8ef0);
      color:#fff;border:none;border-radius:10px;
      font-size:15px;font-weight:700;font-family:inherit;
      cursor:pointer;letter-spacing:.1px;
      transition:filter .2s,opacity .2s;
    }
    .btn:hover{filter:brightness(1.08);}
    .btn:disabled{opacity:.6;cursor:not-allowed;filter:none;}
    .footer{text-align:center;margin-top:22px;font-size:12.5px;color:#9ca3af;}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e7eb}
    .divider span{font-size:11.5px;color:#9ca3af;font-weight:500;white-space:nowrap}
    .btn-ess{
      display:flex;align-items:center;justify-content:center;gap:9px;
      width:100%;padding:12px;border:1.5px solid #bfdbfe;border-radius:10px;
      background:#eff6ff;color:#1d4ed8;font-size:14px;font-weight:600;
      font-family:inherit;cursor:pointer;text-decoration:none;
      transition:background .15s,border-color .15s,box-shadow .15s;
    }
    .btn-ess:hover{background:#dbeafe;border-color:#93c5fd;box-shadow:0 2px 8px rgba(37,99,235,.12)}
    @media(max-width:480px){
      .card{padding:36px 24px 28px;}
    }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img src="/logo.png" alt="ETaxFlow" class="brand-img">
    <div class="brand-sub">Sign in to your account</div>
  </div>
  <div id="err" class="error"></div>
  <div class="field">
    <label for="email">Your email id</label>
    <!-- type="text", not "email" — signIn() falls back to /hr/login for a
         branch/HRMS sub-user, whose username isn't necessarily email-shaped.
         type="email"'s native browser validation blocked the form from ever
         submitting for those users, so the JS fallback never even ran
         (Branch Management Phase 6). -->
    <input id="email" type="text" placeholder="admin@taxflowapp.com or username" autocomplete="username">
  </div>
  <div class="field last">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button id="btn" class="btn" onclick="signIn()">Sign In</button>
  <div class="divider"><span>or</span></div>
  <a href="/ess" class="btn-ess">
    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="6" r="3"/><path d="M2 14c0-3 2.5-5 6-5s6 2 6 5"/></svg>
    Employee Self-Service Login
  </a>
  <div class="footer">Don't have an account? <a href="/signup" style="color:#4f8ef0;text-decoration:none;font-weight:500;">Create one free</a></div>
  <div class="footer" style="margin-top:8px">ETaxFlow &mdash; UAE Business Management Platform</div>
</div>

<script src="/config.js"></script>
<script>
  (async function(){
    var t=localStorage.getItem('taxflow_token');
    if(!t)return;
    try{
      var r=await fetch(apiBase()+'/auth/whoami',{headers:{'Authorization':'Bearer '+t}});
      if(!r.ok)return;
      var who=await r.json();
      if(who.kind==='employee'){preloadAndRedirect('/hrms',t);return;}
      if(who.kind==='branch'){preloadAndRedirect('/',t);return;}
      // Admin: /auth/whoami doesn't carry the admin/superadmin distinction,
      // /auth/me already does — check that only for the User path.
      var meResp=await fetch(apiBase()+'/auth/me',{headers:{'Authorization':'Bearer '+t}});
      var me=await meResp.json();
      if(me&&me.role==='superadmin'){window.location.replace('/superadmin');return;}
      try{sessionStorage.setItem('taxflow_me_cache',JSON.stringify({data:me,ts:Date.now()}));}catch(e){}
      preloadAndRedirect('/',t);
    }catch(e){ window.location.replace('/'); }
  })();

  document.getElementById('email').addEventListener('keydown',function(e){
    if(e.key==='Enter')document.getElementById('password').focus();
  });
  document.getElementById('password').addEventListener('keydown',function(e){
    if(e.key==='Enter')signIn();
  });

  function apiBase(){
    if(window.TAXFLOW_API_BASE_URL)return window.TAXFLOW_API_BASE_URL;
    var h=window.location.hostname;
    if(['localhost','127.0.0.1','::1',''].includes(h))return window.location.protocol+'//'+window.location.host+'/api/v1';
    return window.location.protocol+'//'+h+'/api/v1';
  }

  // Kick off the dashboard bootstrap fetch in the background and redirect
  // as soon as it resolves OR after a short 1.2s cap, whichever comes
  // first — never a forced minimum wait like the old 3-8s version, but
  // still gives a normally-fast API call a real chance to land in
  // sessionStorage before the dashboard needs it (a fetch started here has
  // to be awaited at least a little, since navigating away cancels any
  // request still in flight — there's no way to "fire and forget" one that
  // finishes after the page unloads). If the cap is hit first, the fetch
  // is simply abandoned and the dashboard falls back to fetching its own
  // bootstrap data on load — see hydrateFromServer() /
  // _takeBootstrapPreloadCache() in app.js.
  function preloadAndRedirect(url,token){
    var prefetch=fetch(apiBase()+'/app-data?action=bootstrap',{headers:{'Authorization':'Bearer '+token}})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(json){
        if(json){
          try{sessionStorage.setItem('taxflow_bootstrap_cache',JSON.stringify({data:json,ts:Date.now()}));}catch(e){}
        }
      })
      .catch(function(){});
    var cap=new Promise(function(r){setTimeout(r,1200);});
    Promise.race([prefetch,cap]).then(function(){window.location.replace(url);});
  }

  async function signIn(){
    var btn=document.getElementById('btn');
    var err=document.getElementById('err');
    var email=document.getElementById('email').value.trim();
    var pwd=document.getElementById('password').value;
    err.style.display='none';
    if(!email||!pwd){err.textContent='Please enter your email and password.';err.style.display='block';return;}
    btn.disabled=true;btn.textContent='Signing in…';
    try{
      var resp=await fetch(apiBase()+'/auth/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:email,password:pwd})
      });
      var data=await resp.json();
      if(resp.ok&&data.access_token){
        localStorage.setItem('taxflow_token',data.access_token);
        localStorage.setItem('taxflow_principal_kind','user');
        try{
          var meResp=await fetch(apiBase()+'/auth/me',{headers:{'Authorization':'Bearer '+data.access_token}});
          var me=await meResp.json();
          if(me&&me.role==='superadmin'){window.location.replace('/superadmin');return;}
          try{sessionStorage.setItem('taxflow_me_cache',JSON.stringify({data:me,ts:Date.now()}));}catch(e){}
        }catch(e){}
        preloadAndRedirect('/',data.access_token);
        return;
      }
      // Not a TaxFlow admin account — try as an HRMS sub-user (Employee RBAC
      // login, same identity/login used by HRMS > Users & Roles and /ess).
      // Username is unique platform-wide, so no company reference needed.
      var hrResp=await fetch(apiBase()+'/hr/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:email,password:pwd})
      });
      var hrData=await hrResp.json();
      if(hrResp.ok&&hrData.access_token){
        localStorage.setItem('taxflow_token',hrData.access_token);
        localStorage.setItem('taxflow_principal_kind','employee');
        preloadAndRedirect('/hrms',hrData.access_token);
        return;
      }
      // A 403 from /hr/login (vs 401) means a real employee account was
      // found but something specific blocks it (disabled account, suspended
      // company) — stop here rather than also trying branch-login, same
      // reasoning /auth/login's own 403 already skips the /hr/login attempt.
      if(hrResp.status===401){
        // Not an admin, not an employee — try as a Branch Login (Phase 2):
        // the branch entity's own shared login, same username/password
        // shape, no company reference needed (globally unique username).
        var brResp=await fetch(apiBase()+'/branches/login',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({username:email,password:pwd})
        });
        var brData=await brResp.json();
        if(brResp.ok&&brData.access_token){
          localStorage.setItem('taxflow_token',brData.access_token);
          localStorage.setItem('taxflow_principal_kind','branch');
          preloadAndRedirect('/',brData.access_token);
          return;
        }
        err.textContent=(brResp.status===403?brData.detail:null)||data.detail||"We couldn't sign you in — check your email and password and try again.";
        err.style.display='block';
        btn.disabled=false;btn.textContent='Sign In';
        return;
      }
      err.textContent=hrData.detail||data.detail||"We couldn't sign you in — check your email and password and try again.";
      err.style.display='block';
      btn.disabled=false;btn.textContent='Sign In';
    }catch(e){
      err.textContent='Cannot reach server. Please try again.';
      err.style.display='block';
      btn.disabled=false;btn.textContent='Sign In';
    }
  }
</script>
</body>
</html>
