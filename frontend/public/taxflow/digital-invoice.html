<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Invoice</title>
  <style>
    :root{--accent:#2563eb;--ink:#172033;--muted:#667085;--line:#e5eaf2;--paper:#fff;--bg:#f4f7fb;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.4;padding:16px}
    .wrap{max-width:960px;margin:0 auto}
    .sheet{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 16px 48px rgba(24,34,55,.1)}
    .bar{height:6px;background:linear-gradient(90deg,var(--accent),#0f9f6e)}
    .head{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
    .brand{display:flex;gap:12px;align-items:flex-start}
    .logo{width:48px;height:48px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;letter-spacing:.5px;flex:0 0 auto}
    h1{margin:0;font-size:24px;text-transform:uppercase;text-align:right;letter-spacing:0}
    h2{margin:0 0 3px;font-size:17px}
    .muted{color:var(--muted);font-size:12px}
    .mono{font-family:"Courier New",monospace}
    .right{text-align:right}
    .badge{display:inline-block;margin-top:6px;border:1px solid rgba(37,99,235,.22);background:rgba(37,99,235,.08);color:var(--accent);border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;text-transform:uppercase}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px;padding:14px 24px}
    .panel{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fbfcfe}
    .kicker{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
    .party{font-size:15px;font-weight:700}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;color:var(--muted);min-height:22px}
    .row span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0;max-width:60%}
    .row strong{color:var(--ink);text-align:right;white-space:nowrap;flex-shrink:0;font-size:12px}
    table{width:calc(100% - 48px);margin:0 24px;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
    th{background:#f1f5fb;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:8px 10px}
    td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle;font-size:12px}
    .num{text-align:right;white-space:nowrap}
    .summary{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;padding:14px 24px 20px}
    .notes{border-left:3px solid var(--accent);padding-left:12px;color:var(--muted);font-size:12px}
    .totals{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fbfcfe}
    .total-line,.grand{display:flex;justify-content:space-between;gap:12px}
    .total-line{padding:3px 0;color:var(--muted);font-size:12px}
    .grand{margin-top:8px;padding-top:10px;border-top:1px solid var(--line);font-size:17px;font-weight:800}
    .grand strong{color:var(--accent)}
    .foot{padding:12px 24px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:12px}
    .error{background:#fff;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:16px}
    [dir="rtl"] .right{text-align:left}
    [dir="rtl"] th{text-align:right}
    [dir="rtl"] .num{text-align:left}
    [dir="rtl"] .notes{border-left:0;border-right:3px solid var(--accent);padding-left:0;padding-right:12px}
    [dir="rtl"] .row,[dir="rtl"] .total-line,[dir="rtl"] .grand{flex-direction:row-reverse}
    @media(max-width:680px){
      body{padding:8px}
      .head,.grid,.summary{grid-template-columns:1fr;padding:14px}
      h1,.right{text-align:left}
      table{width:calc(100% - 28px);margin:0 14px;display:block;overflow-x:auto}
      .foot{padding:12px 14px;flex-direction:column}
    }
    @media print{
      body{padding:0;background:#fff}
      .sheet{border:none;border-radius:0;box-shadow:none}
    }
  </style>
</head>
<body>
  <main class="wrap" id="app"></main>
  <script>
    function esc(value){
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function money(value){
      return Number(value || 0).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2});
    }
    function decodeInlinePayload(){
      // Do NOT use URLSearchParams — it converts + to space, corrupting standard base64
      const hash = location.hash.slice(1);
      const m = hash.match(/(?:^|[&])invoice=([^&]*)/);
      if(!m) throw new Error('Invoice data missing from QR link.');
      // Decode percent-encoding in the hash, then normalise both URL-safe and standard base64
      let raw = decodeURIComponent(m[1]);
      raw = raw.replace(/-/g,'+').replace(/_/g,'/');
      while(raw.length % 4) raw += '=';
      return JSON.parse(decodeURIComponent(escape(atob(raw))));
    }
    async function fetchShortPayload(code){
      const resp = await fetch('/api/v1/share/invoice/'+encodeURIComponent(code));
      if(!resp.ok) throw new Error('Invoice link not found or has expired.');
      const json = await resp.json();
      return json.payload;
    }
    async function render(){
      const root=document.getElementById('app');
      root.innerHTML='<div style="text-align:center;padding:40px;color:#667085">Loading invoice…</div>';
      let data;
      const hash = location.hash.slice(1);
      const pathM = location.pathname.match(/\/i\/([^/?#]+)/);
      const shortM = hash.match(/(?:^|[&])s=([^&]+)/);
      try{
        if(pathM){ data=await fetchShortPayload(pathM[1]); }
        else if(shortM){ data=await fetchShortPayload(shortM[1]); }
        else{ data=decodeInlinePayload(); }
      }catch(err){
        root.innerHTML='<div class="error"><strong>Could not open digital invoice.</strong><br>'+esc(err.message)+'</div>';
        return;
      }
      const company=data.company||{};
      const inv=data.invoice||{};
      const labels=inv.labels||{};
      const lines=Array.isArray(inv.lines)&&inv.lines.length?inv.lines:[{description:'Invoice items',unit:'PCS',qty:1,price:inv.subtotal,amount:inv.subtotal}];
      const initials=String(company.logo||company.name||'TF').split(/\s+/).map(part=>part[0]).join('').slice(0,2).toUpperCase()||'TF';
      const accent=company.color||'#2563eb';
      document.documentElement.style.setProperty('--accent',accent);
      document.title='Invoice '+(inv.invoice_no||'Digital Invoice');
      root.innerHTML=`
        <section class="sheet" dir="${company.enableRtl?'rtl':'ltr'}">
          <div class="bar"></div>
          <div class="head">
            <div class="brand">
              <div class="logo">${esc(initials)}</div>
              <div>
                <h2>${esc(company.name||'TaxFlow')}</h2>
                <div class="muted">${esc(company.address||'')}</div>
                <div class="muted mono">${esc(company.trnLabel||'TRN')} ${esc(company.trn||'not set')}</div>
              </div>
            </div>
            <div class="right">
              <h1>${esc(company.taxLabel||'Tax Invoice')}</h1>
              <div class="mono muted">${esc(inv.invoice_no||'Draft')}</div>
              <span class="badge">${esc(inv.status||'Draft')}</span>
            </div>
          </div>
          <div class="grid">
            <div class="panel">
              <div class="kicker">${esc(labels.billTo||'Bill To')}</div>
              <div class="party">${esc(inv.customer||'Customer')}</div>
              <div class="muted mono">${esc(company.customerTrnLabel||'Customer TRN')} ${esc(inv.customer_trn||'not provided')}</div>
              <div class="muted">${esc(inv.customer_address||'')}</div>
            </div>
            <div class="panel">
              <div class="row"><span>${esc(labels.issueDate||'Issue Date')}</span><strong>${esc(inv.date||'-')}</strong></div>
              <div class="row"><span>${esc(labels.dueDate||'Due Date')}</span><strong>${esc(inv.due_date||'-')}</strong></div>
              <div class="row"><span>${esc(labels.paymentTerms||'Terms')}</span><strong>${esc(inv.terms||'Net 30')}</strong></div>
              ${inv.po_number?`<div class="row"><span>${esc(labels.purchaseOrder||'Purchase Order No.')}</span><strong>${esc(inv.po_number)}</strong></div>`:''}
              ${inv.delivery_note_no?`<div class="row"><span>${esc(labels.deliveryNote||'Delivery Note No.')}</span><strong>${esc(inv.delivery_note_no)}</strong></div>`:''}
              ${inv.reference_no?`<div class="row"><span>${esc(labels.reference||'Reference No.')}</span><strong>${esc(inv.reference_no)}</strong></div>`:''}
              <div class="row"><span>${esc(labels.currency||'Currency')}</span><strong>${esc(inv.currency||'AED')}</strong></div>
            </div>
          </div>
          <table>
            <thead><tr><th>#</th><th>${esc(labels.product||'Product')}</th><th>${esc(labels.unit||'Unit')}</th><th class="num">${esc(labels.quantity||'Qty')}</th><th class="num">${esc(labels.unitPrice||'Unit Price')}</th><th class="num">${esc(labels.amount||'Amount')}</th></tr></thead>
            <tbody>${lines.map((line,index)=>`<tr><td class="mono">${index+1}</td><td><strong>${esc(line.description||'Item')}</strong></td><td>${esc(line.unit||'PCS')}</td><td class="num mono">${esc(line.qty||1)}</td><td class="num mono">${money(line.price)}</td><td class="num mono">${money(line.amount)}</td></tr>`).join('')}</tbody>
          </table>
          <div class="summary">
            <div class="notes">
              <div class="kicker">${esc(labels.paymentDetails||'Payment Details')}</div>
              ${company.bankName?`<div>${esc(company.bankName)}</div>`:''}
              ${company.accountName?`<div>${esc(company.accountName)}</div>`:''}
              ${company.accountNumber?`<div class="mono">${esc(company.accountNumber)}</div>`:''}
              ${company.iban?`<div class="mono">IBAN ${esc(company.iban)}</div>`:''}
              ${company.swiftCode?`<div class="mono">SWIFT ${esc(company.swiftCode)}</div>`:''}
              <div style="margin-top:8px">${esc(company.footer||'')}</div>
            </div>
            <div class="totals">
              <div class="total-line"><span>${esc(labels.subtotal||'Subtotal')}</span><strong class="mono">${esc(inv.currency||'AED')} ${money(inv.subtotal)}</strong></div>
              <div class="total-line"><span>${esc(labels.vat||'VAT')}</span><strong class="mono">${esc(inv.currency||'AED')} ${money(inv.vat_amount)}</strong></div>
              <div class="grand"><span>${esc(labels.total||'Total')}</span><strong class="mono">${esc(inv.currency||'AED')} ${money(inv.total)}</strong></div>
            </div>
          </div>
          <div class="foot"><span>${esc(labels.digitalGenerated||'Digital invoice generated by TaxFlow')}</span><span class="mono">${esc(location.href.split('#')[0])}</span></div>
        </section>`;
    }
    render();
  </script>
</body>
</html>
