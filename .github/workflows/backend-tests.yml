name: Backend tests & security scan

# Runs the full backend test suite on every push and pull request, and scans the
# Python dependencies for known vulnerabilities. A red check here should block merging.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest python-dotenv
      - name: Run tests
        working-directory: backend
        env:
          # No real AI calls from CI; tests stub the AI client.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: python -m pytest tests -q -p no:warnings

  tests-postgres:
    # Same suite against PostgreSQL (production's database): SQLite doesn't enforce foreign
    # keys, returns naive datetimes and orders rows differently, which hid real bugs.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taxflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest python-dotenv
      - name: Run tests on PostgreSQL
        working-directory: backend
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/taxflow_test
        run: python -m pytest tests -q -p no:warnings

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        # ecdsa (via python-jose) has no fixed release; the app signs tokens with HS256 only,
        # so its ECDSA code path is never used. Remove this ignore once python-jose is replaced.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325
