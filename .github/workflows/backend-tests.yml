name: Backend tests & security scan

# Runs the full backend test suite on every push and pull request, and scans the
# Python dependencies for known vulnerabilities. A red check here should block merging.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest python-dotenv
      - name: Run tests
        working-directory: backend
        env:
          # No real AI calls from CI; tests stub the AI client.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: python -m pytest tests -q -p no:warnings

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        # ecdsa (via python-jose) has no fixed release; the app signs tokens with HS256 only,
        # so its ECDSA code path is never used. Remove this ignore once python-jose is replaced.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325
